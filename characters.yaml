# The Pen Family — Voice & Personality Bible
# Edge TTS voices: voice_rate and voice_pitch can be set per character
# voice_rate: "+N%" or "-N%"  |  voice_pitch: "+NHz" or "-NHz"

characters:
  oz:
    name: "Oz"
    role: "Dad"
    persona: "Southern American dad pen, 35. Warm, slightly old-school. Uses complete sentences. Gives advice nobody asked for. Tries to sound wise. Says 'Back in my day' and 'Family meeting!'. Protective, responsible, slightly goofy, loves his family. NEVER speaks like a teenager."
    voice: "am_adam"
    voice_openai: "onyx"
    voice_instructions: "45-year-old American dad: settled, dignified and calm, but cheerful and warm. Deep steady voice with a smile in it. Fatherly, reassuring, occasionally chuckles."
    voice_edge: "en-US-ChristopherNeural"
    color: "#3f6fc4"
    scale: 1.05

  mas:
    name: "Mas"
    role: "Mom"
    persona: "Smart New York mom pen, 32. Calm during chaos. Direct and fast. Already knows the answer. Says 'I knew this would happen' and 'Everybody relax.' The smartest person in the house. Funny without trying. NEVER panics or overreacts."
    voice: "af_heart"
    voice_openai: "sage"
    voice_instructions: "40-year-old American mom: mature and composed but lively and energetic. Warm, clear, confident motherly voice."
    voice_edge: "en-US-JennyNeural"
    color: "#ff7fa0"
    scale: 1.0

  bas:
    name: "Bas"
    role: "Big sister"
    persona: "16-year-old teal teen girl pen. Social media language, dramatic, expressive. Says 'Seriously?', 'That is so embarrassing.', 'Please don't post that.', 'I need content.' Wants to be famous, fashion-focused, secretly loves family. NEVER sounds like an adult."
    voice: "af_nicole"
    voice_openai: "shimmer"
    voice_instructions: "15-year-old American teenage girl: delicate, soft-spoken and gentle, sweet light young voice. Never sounds like an adult woman."
    voice_edge: "en-US-EmmaNeural"
    voice_rate: "+10%"
    voice_pitch: "+20Hz"
    color: "#2EC4C4"
    scale: 0.96

  saf:
    name: "Saf"
    role: "Little sister"
    persona: "9-year-old purple pen girl. Talks fast. Endlessly curious. Always asks at least ONE funny question. Says 'Why?', 'Wait...', 'How does that work?', 'I have another question.' Smart for her age. Innocent and funny."
    voice: "af_bella"
    voice_openai: "nova"
    voice_instructions: "9-year-old American girl: smart, quick and bright. Clear articulate school-kid voice, proud and clever. Never sounds like an adult."
    voice_provider: "edge"
    voice_edge: "en-US-AnaNeural"
    color: "#9B5FC4"
    scale: 0.88

  sem:
    name: "Sem"
    role: "Little brother"
    persona: "4-year-old green preschool boy pen. VERY IMPORTANT: Sem is FOUR years old, NOT a teenager. Short simple sentences. Big emotions. Mispronounces some words. Says 'I got a pwan!', 'Look what I did!', 'Uh oh...', 'Can I do it?' Chaos machine. Thinks every idea is genius. Fearless. Extremely lovable. He STARTS the problem most episodes."
    voice: "af_sky"
    voice_openai: "coral"
    voice_instructions: "4-year-old American toddler BOY: tiny, high-pitched, bouncy little-kid voice with huge emotions, sometimes mispronounces words. Absolutely never sounds like an adult."
    voice_provider: "edge"
    voice_edge: "en-US-GuyNeural"
    voice_rate: "+15%"
    voice_pitch: "+40Hz"
    color: "#4cae5a"
    scale: 0.80

  mira:
    name: "Mira"
    role: "Baby"
    persona: "1-year-old yellow baby girl pen. Mostly sounds and single words: 'Ba-ba!', 'Hehe!', 'Uh-oh!', 'Yay!'. NEVER speaks actual sentences. The joke is she somehow solves the problem anyway."
    voice: "af_sky"
    voice_openai: "shimmer"
    voice_instructions: "1.5-year-old baby girl: babbly, cooing, giggly, adorable tiny baby cadence. Mostly baby sounds like 'gaga', 'ooooh', giggles, plus a few very simple tiny words like 'dada', 'mama'. Sweet and cute, never sounds grown."
    voice_provider: "edge"
    voice_edge: "en-US-AnaNeural"
    voice_rate: "+30%"
    voice_pitch: "+60Hz"
    color: "#ffcc4d"
    scale: 0.70

  eli:
    name: "Eli"
    role: "Neighbor friend"
    persona: "Cheerful red eraser who lives next door. Always tries to help fix mistakes. Says 'No worries, I can fix that!' / 'Oops, let me help!' / 'Mistakes happen!' Optimistic, helpful, slightly clumsy. Never gives up."
    voice: "af_heart"
    voice_edge: "en-US-AndrewNeural"
    voice_rate: "+5%"
    color: "#E84060"
    scale: 0.90

  kit:
    name: "Kit"
    role: "Cousin (Notebook)"
    persona: "Smart dark-blue notebook cousin who visits sometimes. Nerdy, remembers everything, loves facts. Says 'Actually...' / 'According to my notes...' / 'I wrote that down!' Secretly wants to be cool. Wears invisible glasses."
    voice: "af_bella"
    voice_edge: "en-US-EricNeural"
    voice_rate: "+0%"
    color: "#2040AA"
    scale: 0.92

  rex:
    name: "Rex"
    role: "Grandpa (Ruler)"
    persona: "Strict golden-orange ruler grandpa. Old-fashioned, measures everything, gives unsolicited advice. Says 'In MY day...' / 'Let me be straight with you...' / 'I have the measure of this situation.' Grumpy but lovable."
    voice: "am_adam"
    voice_edge: "en-US-SteffanNeural"
    voice_rate: "-10%"
    voice_pitch: "-15Hz"
    color: "#E8A820"
    scale: 0.98

  nib:
    name: "Nib"
    role: "Aunt (Marker)"
    persona: "Dramatic yellow-green marker aunt who visits unexpectedly. Creative, expressive, colorful personality. Says 'Darling!' / 'This is BRILLIANT!' / 'Let me add some color to this!' Loves art, fashion, drama."
    voice: "af_nicole"
    voice_edge: "en-US-AriaNeural"
    voice_rate: "+8%"
    voice_pitch: "+10Hz"
    color: "#90CC20"
    scale: 0.94

  biscuit:
    name: "Biscuit"
    role: "Family dog"
    persona: "The Pen Family's golden retriever puppy. Energetic, loyal, always excited. Simple sounds only: 'Woof!', 'Arf!', 'Woof woof!'. Runs into scenes unexpectedly. Licks everything. Chases cats. Mira's best friend."
    voice: "af_sky"
    voice_openai: "verse"
    voice_instructions: "Playful puppy character: quick happy yips, short excited phrases, boundless doggy energy."
    voice_edge: "en-US-AnaNeural"
    voice_rate: "+30%"
    voice_pitch: "+60Hz"
    color: "#E8A820"
    scale: 0.72

  mittens:
    name: "Mittens"
    role: "Family cat"
    persona: "The Pen Family's orange tabby cat. Lazy, sassy, judges everyone. Single words only: 'Meow.', 'Prrr...', 'Hiss!'. Ignores everyone except Mira. Knocks things off tables. Acts like she owns the house."
    voice: "af_nicole"
    voice_edge: "en-US-JennyNeural"
    voice_rate: "-15%"
    voice_pitch: "+30Hz"
    color: "#FF8844"
    scale: 0.65

  snip:
    name: "Snip"
    role: "School friend (Sharpener)"
    persona: "A cheerful blue pencil sharpener who goes to Saf and Sem's school. Always ready with a solution. Says 'I can sharpen that idea!' / 'Let me help!' / 'That is actually brilliant!' Positive, helpful, creative thinker."
    voice: "af_bella"
    voice_edge: "en-US-JaneNeural"
    voice_rate: "+5%"
    voice_pitch: "+15Hz"
    color: "#4488FF"
    scale: 0.85

  twinkle:
    name: "Twinkle"
    role: "Guest star"
    persona: "A tiny magical star child who fell from the sky. Speaks in short chime-like sentences. Sweet, shy at first, giggly when happy. Says 'twinkle twinkle' when excited."
    voice: "af_sky"
    voice_openai: "coral"
    voice_instructions: "A tiny magical star creature child: chime-like, giggly, high sweet little voice, slightly echoey and sparkly feel, shy and adorable. Sounds like a magical 5-year-old."
    voice_edge: "en-US-AnaNeural"
    voice_rate: "+12%"
    voice_pitch: "+45Hz"
    color: "#FFD75E"
    scale: 0.6

backgrounds:
  - home
  - kitchen
  - bedroom
  - bathroom
  - school
  - park
  - shop
  - street
