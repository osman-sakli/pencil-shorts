# Cast — characters are fully code-drawn (renderer/src/cast.tsx).
# This file carries metadata only: name, persona (for the LLM), TTS voice, subtitle colour.
# To add a character: add an entry here + a component in cast.tsx.

characters:
  kursun:
    name: "Pencil"
    persona: "Perfectionist, slightly arrogant yellow pencil who brags about being sharp."
    voice: "en-US-GuyNeural"
    color: "#e0ad2c"
    scale: 1.0

  silgi:
    name: "Eraser"
    persona: "Calm, sarcastic pink eraser who thrives on other people's mistakes."
    voice: "en-US-JennyNeural"
    color: "#d8728f"
    scale: 0.95

  tukenmez:
    name: "Ballpoint"
    persona: "Drama-queen blue pen who thinks it's immortal and never lets anyone forget it."
    voice: "en-US-GuyNeural"
    color: "#3b7dd8"
    scale: 1.0

  kalemtras:
    name: "Sharpener"
    persona: "Menacing but goofy teal sharpener who threatens to sharpen everyone."
    voice: "en-US-AriaNeural"
    color: "#1f8d80"
    scale: 0.9

# Scene labels (renderer draws these in code; labels give the LLM context).
backgrounds:
  - notebook
  - desk
  - pencilcase
