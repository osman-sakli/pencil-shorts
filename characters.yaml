# The Pen Family — 6 code-drawn pen characters (renderer/src/cast.tsx).
# voice: Kokoro TTS voice ID (TTS_PROVIDER=kokoro)
#        EdgeTTS fallback voice also listed for TTS_PROVIDER=edge

characters:
  oz:
    name: "Oz"
    role: "Dad"
    persona: "Warm but slightly dramatic dad pen. Takes everything a bit too seriously but always means well."
    voice: "am_adam"          # Kokoro: deep adult male
    voice_edge: "en-US-GuyNeural"
    color: "#3f6fc4"
    scale: 1.05

  mas:
    name: "Mas"
    role: "Mom"
    persona: "Calm, witty mom pen. The glue of the family. Diffuses drama with one well-timed remark."
    voice: "af_heart"         # Kokoro: warm adult female
    voice_edge: "en-US-JennyNeural"
    color: "#ff7fa0"
    scale: 1.0

  bas:
    name: "Bas"
    role: "Big sister"
    persona: "16-year-old big sister. Sharp, sarcastic, secretly caring. Always has receipts on everyone."
    voice: "af_nicole"        # Kokoro: young adult female
    voice_edge: "en-US-AriaNeural"
    color: "#a06cd8"
    scale: 0.98

  saf:
    name: "Saf"
    role: "Little sister"
    persona: "9-year-old little sister. Enthusiastic, loud, asks too many questions, accidentally causes chaos."
    voice: "af_bella"         # Kokoro: bright young female
    voice_edge: "en-US-JennyNeural"
    color: "#34bfb0"
    scale: 0.9

  sem:
    name: "Sem"
    role: "Son"
    persona: "12-year-old son. Tries to be cool, fails adorably. Blames everyone else first."
    voice: "am_michael"       # Kokoro: young adult male
    voice_edge: "en-US-GuyNeural"
    color: "#4cae5a"
    scale: 0.92

  mira:
    name: "Mira"
    role: "Baby"
    persona: "2-year-old baby. Says very little but somehow always causes the most trouble."
    voice: "af_sky"           # Kokoro: light/high female (closest to toddler)
    voice_edge: "en-US-AriaNeural"
    color: "#ffcc4d"
    scale: 0.78

backgrounds:
  - home
  - school
  - park
  - shop
  - office
  - street
